name: ML CI/CD

# Runs on every push / PR to main, and can also be started manually
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint code
        run: |
          pylint app.py train.py --output=pylint-report.txt --exit-zero
          flake8 app.py train.py --ignore=E501,E302 --output-file=flake8-report.txt
          black app.py train.py

      - name: Train model
        run: python train.py

      - name: Test code
        run: pytest tests/

      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lint-reports
          path: |
            pylint-report.txt
            flake8-report.txt

  build-scan-push:
    name: Build, Scan and Push Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Clone repository
        uses: actions/checkout@v4

      - name: Set image name (must be lowercase)
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Trivy filesystem scan
        run: |
          docker run --rm -v "$PWD:/src" aquasec/trivy:latest fs --format table /src | tee trivy-fs-report.txt

      - name: Build Docker image
        run: docker build -t "$IMAGE:latest" .

      - name: Trivy image scan
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image --format table "$IMAGE:latest" | tee trivy-image-report.txt

      - name: Upload security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-reports
          path: trivy-*-report.txt

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Push image
        if: github.event_name != 'pull_request'
        run: docker push "$IMAGE:latest"

  deploy-smoke-test:
    name: Deploy (run container and check it)
    needs: build-scan-push
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Set image name
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin

      - name: Pull and run the pushed image
        run: |
          docker pull "$IMAGE:latest"
          docker run -d --name ml-app -p 5000:5000 "$IMAGE:latest"
          sleep 8

      - name: Check the app responds
        run: |
          curl -f http://localhost:5000/
          curl -f -X POST http://localhost:5000/predict \
            -H "Content-Type: application/json" \
            -d '{"features": [5.1, 3.5, 1.4, 0.2]}'

      - name: Show container logs
        if: always()
        run: docker logs ml-app
